<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Offline-first BSCS2C class treasury dashboard">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>BSCS2C Treasurer</title>
</head>
<body>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>

  <section id="loginScreen" class="login-screen">
    <div class="login-card glass">
      <div class="brand-mark">₱</div>
      <p class="eyebrow">CLASS TREASURY</p>
      <h1>BSCS2C</h1>
      <p class="muted">Offline-first Treasurer Dashboard</p>
      <form id="loginForm">
        <label class="field-label" for="passwordInput">Treasurer password</label>
        <div class="password-wrap">
          <span class="password-icon" aria-hidden="true">⌘</span>
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Enter treasurer password" required>
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">Show</button>
        </div>
        <button class="primary-btn full" type="submit">Unlock Dashboard</button>
      </form>
      <p class="login-note">Developed by <strong>RG Sinson</strong> · BSCS2C Treasurer</p>
    </div>
  </section>

  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">₱</div>
        <div><strong>BSCS2C</strong><span>Treasury</span></div>
      </div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button>
        <button class="nav-item" data-view="students">♙ <span>Students</span></button>
        <button class="nav-item" data-view="contributions">₱ <span>Contributions</span></button>
        <button class="nav-item" data-view="quickRecord"><svg class="nav-icon quick-record-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.1 2.7 5.7 13h5.5l-.7 8.3L18.3 11h-5.4l.2-8.3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Quick Record</span></button>
        <button class="nav-item" data-view="collectionSessions">▣ <span>Collection Sessions</span></button>
        <button class="nav-item" data-view="expenses">↗ <span>Expenses</span></button>
        <button class="nav-item" data-view="reports">▥ <span>Reports</span></button>
        <button class="nav-item" data-view="recycle">♻ <span>Recycle Bin</span></button>
        <button class="nav-item" data-view="activity">◷ <span>Activity Log</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="settings">⚙ <span>Settings</span></button>
        <button class="nav-item danger-link" id="lockBtn">⌑ <span>Lock</span></button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="Open navigation">☰</button>
        <div>
          <p class="eyebrow" id="pageEyebrow">OVERVIEW</p>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="top-actions">
          <span class="online-pill" id="onlinePill"><i></i> Offline ready</span>
          <button class="ghost-btn" id="quickContributionBtn">+ Contribution</button>
        </div>
      </header>

      <div id="viewContainer"></div>
    </main>
  </div>

  <div id="modalRoot"></div>

  <script src="app.js"></script>
</body>
</html>
